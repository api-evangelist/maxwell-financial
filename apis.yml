aid: maxwell-financial
name: Maxwell Financial
description: >-
  Maxwell is an end-to-end mortgage-origination technology and services company
  serving banks, independent mortgage banks, and credit unions. Its platform
  spans a customizable borrower Point of Sale, a Lender Hub for loan officers
  (pipeline, application processing, document validation, underwriting, and
  pricing), Business Intelligence analytics, and outsourced services including
  Maxwell Fulfillment (processing, underwriting, closing), Maxwell Diligence
  (QC and due diligence), and Private Label Origination. The product is a hosted
  SaaS delivered through login-gated lender and borrower hubs with a public
  documentation hub; it does not publish an open, versioned developer API.
